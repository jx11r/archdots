shadow = true;
shadow-radius = 14;
shadow-opacity = 0.20;
shadow-offset-x = -7;
shadow-offset-y = -7;

fading = true;
fade-in-step = 0.1;
fade-out-step = 0.1;

frame-opacity = 1.0;
corner-radius = 10;

dithered-present = false;
detect-client-opacity = true;
detect-rounded-corners = true;
detect-transient = true;
use-damage = true;
backend = "glx";
vsync = true;

rules: ({
  match = "window_type = 'tooltip'";
  fade = false;
  shadow = true;
  opacity = 0.75;
  full-shadow = false;
}, {
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "class_g = 'Xephyr'      || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
}, {
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "class_g = 'Xephyr'      || " 
          "fullscreen";
  corner-radius = 0;
}, {
  match = "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "class_g ?= 'Notify-osd' || "
          "class_g = 'Cairo-clock' || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
},{
  match = "window_type = 'dock' && "
          "class_g = 'awesome'";
  corner-radius = 10;
})
